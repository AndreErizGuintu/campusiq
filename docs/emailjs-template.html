<!--
  CampusIQ email template for EmailJS
  ------------------------------------
  1. EmailJS dashboard > Email Services > Add New Service > Gmail (connect your account). Copy the Service ID.
  2. Email Templates > Create New Template.
       Subject:     {{subject}}
       To Email:    {{to_email}}
       From Name:   CampusIQ
       Reply To:    (your school / team email, optional)
     Content: switch the editor to "Code" and paste everything below this comment.
  3. Save, copy the Template ID. Account > General: copy the Public Key.
  4. Put them in .env: EMAILJS_PUBLIC_KEY, EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID.

  Variables CampusIQ sends with every email:
    {{to_email}}        recipient address (one email per recipient)
    {{to_name}}         recipient name (student or guardian)
    {{recipient_role}}  "student" or "guardian"
    {{student_name}}    the student the email is about
    {{subject}}         subject line
    {{message}}         the message body (plain text)
    {{from_name}}       always "CampusIQ"
-->
<div style="margin:0;padding:24px 12px;background:#f5f6fa;font-family:Arial,Helvetica,sans-serif;color:#1b1e27;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e3e6ee;border-radius:12px;overflow:hidden;">
    <div style="padding:18px 24px;border-bottom:3px solid #4338ca;">
      <span style="display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:7px;background:#4338ca;color:#ffffff;font-family:'Courier New',monospace;font-weight:bold;font-size:12px;">CQ</span>
      <span style="font-family:'Courier New',monospace;font-weight:bold;font-size:16px;vertical-align:middle;margin-left:8px;">CampusIQ</span>
    </div>
    <div style="padding:24px;">
      <h1 style="margin:0 0 6px;font-size:18px;line-height:1.35;">{{subject}}</h1>
      <p style="margin:0 0 18px;font-size:12px;color:#6b7083;">About {{student_name}} &middot; sent to {{to_name}} ({{recipient_role}})</p>
      <p style="margin:0 0 18px;font-size:14px;line-height:1.7;color:#2b2f3e;white-space:pre-line;">{{message}}</p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#454a5c;">You can see the full record any time by logging in to CampusIQ.</p>
    </div>
    <div style="padding:14px 24px;background:#f7f8fb;border-top:1px solid #eef0f5;font-size:11.5px;color:#9095a5;">
      Sent automatically by CampusIQ through EmailJS when a record was saved. Holy Cross College &middot; BSIT 4A CommIT Team.
    </div>
  </div>
</div>
